[package]
name = "cutebot"
version = "0.1.3"
edition = "2024"
authors = ["Grobochan"]
description = "A silly discord bot made by Grobochan for her server"
repository = "https://github.com/grobo-chan/cutebot"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
dotenvy = "0.15.7"
futures = "0.3.32"
poise = { version = "0.6.1", default-features = false, features = ["cache", "chrono", "handle_panics"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = ["default_native_tls"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
tokio = { version = "1.49.0", features = ["full"] }
